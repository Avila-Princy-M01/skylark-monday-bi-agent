name: Continuous Deployment & Smoke Test Gate

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Target URL to smoke test"
        required: true
        default: "https://skylark-monday-bi-agent-blush.vercel.app"

jobs:
  smoke-test-deployment:
    name: 🩺 Post-Deployment Health & Smoke Verification
    if: github.event.deployment_status.state == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies with Frozen Lockfile
        run: npm ci

      - name: Resolve Deployment URL
        id: resolve-url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_url=${{ github.event.inputs.deployment_url }}" >> $GITHUB_OUTPUT
          else
            echo "target_url=${{ github.event.deployment_status.target_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Deployment Smoke Test Probe
        run: npm run smoke:test
        env:
          DEPLOYMENT_URL: ${{ steps.resolve-url.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || secrets.VERCEL_PROTECTION_BYPASS }}
