name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================================
  # 1. SECRET SCANNING & SECURITY ADVISORY AUDIT
  # ============================================================================
  security-audit-and-secret-scan:
    name: 🛡️ Secret Scan & Security Audit (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner (Blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Setup Node.js Environment with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Run Security Audit (Non-Blocking Advisory)
        run: |
          echo "Running npm audit check..."
          npm audit --audit-level=high || true

  # ============================================================================
  # 2. CODE QUALITY, FORMATTING & LINTING (Parallel)
  # ============================================================================
  lint-and-format:
    name: 🧹 Lint & Formatting Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies with Frozen Lockfile
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

  # ============================================================================
  # 3. STRICT TYPE CHECKING (Parallel)
  # ============================================================================
  typecheck:
    name: 🔷 Strict Type Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies with Frozen Lockfile
        run: npm ci

      - name: TypeScript Compiler Check
        run: npm run typecheck

  # ============================================================================
  # 4. HERMETIC DETERMINISTIC TESTS & PR COVERAGE BOT (Mocked, Zero Flake)
  # ============================================================================
  deterministic-test-suite:
    name: 🧮 Deterministic Math & Coverage Bot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies with Frozen Lockfile
        run: npm ci

      - name: Run Determinism & Invariant Test Suite with Coverage
        run: npm run test:coverage

      - name: Report Vitest PR Coverage Summary
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: "./coverage/coverage-summary.json"
          json-final-path: "./coverage/coverage-final.json"
        continue-on-error: true

  # ============================================================================
  # 5. PRODUCTION BUILD GATE
  # ============================================================================
  production-build-gate:
    name: 🚀 Production Build Gate
    needs: [lint-and-format, typecheck, deterministic-test-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies with Frozen Lockfile
        run: npm ci

      - name: Build Next.js Application (Validating Production Bundles)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MONDAY_API_TOKEN: "ci_token_test_stub"
          DEALS_BOARD_ID: "1111111111"
          WORK_ORDERS_BOARD_ID: "2222222222"
